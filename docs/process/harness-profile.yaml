schema_version: 1
profile_id: harness.backend-delivery
status: active
name: 后端专职交付 Harness
purpose: 承接批准战略，完成后端战术设计、冻结接口及部署验证，按业务切片交付真实接口。
audience:
  target_user_roles:
  - role.architecture-agent
  - role.backend-agent
  - role.test-agent
  control_plane_roles:
  - role.harness-orchestrator
  non_target_role_policy: 另一端角色只允许无写路径的只读输入评审；不得派发另一端实现或起草任务。共享角色表保留来源批准身份。
  boundary: 职责按业务切片接力；后端交付、前端验收和统一管理方业务验收分别记录。上游规则及 API 变化回交权威方，不在本仓静默重定义。
lifecycle:
  repository_modes:
  - project-instance
  entry_work_unit: work-unit.harness-entry
  allowed_work_units:
  - work-unit.harness-entry
  - work-unit.tactical-design
  - work-unit.slice-contract
  - work-unit.slice-implementation
  - work-unit.verification
  terminal_work_unit: work-unit.verification
  terminal_stage: stage.verification
  forbidden_work_units:
  - work-unit.ssot-update
  - work-unit.skill-projection-sync
  - work-unit.intensity-aware-verification
  - work-unit.intensity-aware-review
  - work-unit.release-and-rollback
upstream:
  kind: approved-spec-or-strategic-design
  default_entry: work-unit.harness-entry
  discovery_is_default: false
  strategic_design_handoff:
    schema_ref: docs/process/schemas/strategic-design-handoff.schema.json
    required_schema_version: 3
    ui_impact_requires_visual_baseline_schema_version: 1
    stale_baseline_policy: block-and-reroute
  compatibility_skills:
  - grill-with-docs
  - to-spec
  - to-tickets
instantiation:
  cli_package: create-yss-harness-backend
  npm_create: npm create yss-harness-backend@latest
  metadata_file: .yss-harness-backend.json
  foreign_metadata_files:
  - .yss-template.json
  - .yss-harness-dev.json
  - .yss-harness-frontend.json
  template_source: github:iloveZzz/yss-harness-backend-agent
  distribution_manifest: .template-source/distribution/template.manifest.json
  pin_env: YSS_HARNESS_TEMPLATE_REF
  command: npx create-yss-harness-backend@latest init --target-dir <directory>
execution:
  side: backend
  terminal_conclusion: backend-deliverable
  business_acceptance_owner: registered-coordinating-project
