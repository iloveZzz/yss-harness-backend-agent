schema_version: 1
document_writing:
  supporting_skill: i-have-adhd
  condition: lifecycle-document-output
  scope: current-document-work-only
  dispatch: pass-condition-and-reference-to-document-owner
  reference: docs/process/document-writing.md
  examples: docs/templates/examples/lifecycle-writing-examples.md
  artifact_ownership: unchanged
  gate_and_status_semantics: unchanged
contract_id: harness-backend-contract-v1
status: active
owner: role.harness-orchestrator
target_scope: backend-delivery
orchestrator: role.harness-orchestrator
roles:
  - role.architecture-agent
  - role.backend-agent
  - role.test-agent
states:
  - draft
  - ready-for-review
  - approved
  - ready-for-agent
  - in-progress
  - verification
  - verified
  - completed
  - blocked
  - stale
  - drift
  - new_impacts
execution_states:
  - Explorer
  - Drafter
  - Worker
  - Reviewer
  - Verifier
entry:
  required:
    - yss-project.yaml
    - CONTEXT.md
    - approved-upstream-inputs
  rejected:
    - missing-context
    - invalid-repository-mode
    - stale-upstream-input
technical_design:
  backend_delivery: required
  required_for_impacts:
    - backend_use_case
    - business_rule
    - layering
    - domain_behavior
    - aggregate
    - invariant
    - state_machine
    - consistency
    - domain_event
    - gateway_boundary
    - persistence_mapping
  no_impact: forbidden-for-backend-delivery
  owner: role.architecture-agent
  review_by: role.test-agent
  data_architecture_decision:
    schema_version: 1
    impact_modes: [ required, not-applicable ]
    required_when_data_impact: [ data_architecture_ref, data_architecture_digest, review_evidence_refs ]
    not_applicable_requires: [ assessment_ref, assessment_digest, reason, evidence_refs ]
  api_contract_decision:
    schema_version: 1
    impact_modes: [ required, not-applicable ]
    required_when_api_impact:
      [
        openapi_ref,
        openapi_version,
        openapi_digest,
        validation_record_ref,
        validation_record_digest,
        draft_review_ref,
        draft_review_digest,
        freeze_version,
        freeze_time
      ]
    same_draft_bytes_required_across: [ openapi, validation, draft-review, freeze, engineering-approval ]
    validation_requires: [ openapi-3.1, locked-redocly, exit-code-zero, all-checks-passed ]
    review_requires: [ approved, no-blocking-findings, independent-review-evidence ]
    not_applicable_requires: [ assessment_ref, assessment_digest, reason, evidence_refs ]
    placeholder_assets: forbidden
  approval_gate: gate.engineering-contract-approved
slice_contract:
  id: slice-implementation-contract-v2
  one_contract_per_slice: true
  shared_version_required: true
  resolution_digest_required: true
  required_sections:
    - architecture
    - frontend
    - backend
    - testing
work_unit_routes:
  work-unit.harness-entry:
    primary_skill: harness-orchestrator
    supporting_skills:
      - implementation-repo-onboarding
      - yss-research
    skills:
      - harness-orchestrator
      - implementation-repo-onboarding
      - yss-research
    applies_when: harness_entry
    not_applicable_reason: harness_context_already_verified
  work-unit.technical-design:
    primary_skill: architecture-agent
    supporting_skills:
      - yss-technical-design
      - yss-openapi-governance
      - yss-openapi-draft-review
      - codebase-design
      - yss-research
      - tdd
    skills:
      - architecture-agent
      - yss-technical-design
      - yss-openapi-governance
      - yss-openapi-draft-review
      - codebase-design
      - yss-research
      - tdd
    applies_when: backend_delivery_impact
    not_applicable_reason: forbidden-for-backend-delivery
    architecture_route:
      domain-driven:
        - yss-tactical-design
        - domain-modeling
      layered-mvc:
        - yss-technical-design
  work-unit.implementation-repository-preparation:
    primary_skill: harness-orchestrator
    supporting_skills:
      - implementation-repo-onboarding
      - yss-implementation-contract-compiler
      - yss-ddd-scaffold-generator
      - yss-layered-mvc-scaffold-generator
    skills:
      - harness-orchestrator
      - implementation-repo-onboarding
      - yss-implementation-contract-compiler
      - yss-ddd-scaffold-generator
      - yss-layered-mvc-scaffold-generator
    applies_when: approved_engineering_contract
    not_applicable_reason: backend profile 中不可跳过；仅非后端且无实现仓库影响的其他 profile 可记录不适用
    result_schema_version: 2
    must_complete_before: work-unit.slice-contract
  work-unit.slice-contract:
    primary_skill: harness-orchestrator
    supporting_skills:
      - architecture-agent
      - yss-implementation-contract-compiler
      - implementation-repo-onboarding
    skills:
      - harness-orchestrator
      - architecture-agent
      - yss-implementation-contract-compiler
      - implementation-repo-onboarding
    applies_when: implementation_repository_preparation_completed_and_frozen_contracts
    not_applicable_reason: required_upstream_contract_not_current
  work-unit.slice-implementation:
    primary_skill: backend-agent
    supporting_skills:
      - test-agent
      - yss-implementation-contract-compiler
      - tdd
    skills:
      - backend-agent
      - test-agent
      - yss-implementation-contract-compiler
      - tdd
    applies_when: slice_contract_ready_for_agent
    not_applicable_reason: slice_contract_not_approved
  work-unit.verification:
    primary_skill: test-agent
    supporting_skills:
      - code-review
      - diagnosing-bugs
      - tdd
    skills:
      - test-agent
      - code-review
      - diagnosing-bugs
      - tdd
    applies_when: implementation_candidate_ready_for_verification
    not_applicable_reason: implementation_not_complete
  work-unit.ssot-update:
    primary_skill: maintaining-skills
    supporting_skills:
      - codebase-design
    skills:
      - maintaining-skills
      - codebase-design
    applies_when: template_authority_changes
    not_applicable_reason: no_template_authority_change
  work-unit.skill-projection-sync:
    primary_skill: maintaining-skills
    supporting_skills: []
    skills:
      - maintaining-skills
    applies_when: canonical_skill_changes
    not_applicable_reason: no_skill_change
  work-unit.intensity-aware-verification:
    primary_skill: maintaining-skills
    supporting_skills:
      - tdd
    skills:
      - maintaining-skills
      - tdd
    applies_when: template_maintenance_verification
    not_applicable_reason: no_template_maintenance
  work-unit.intensity-aware-review:
    primary_skill: code-review
    supporting_skills:
      - maintaining-skills
    skills:
      - code-review
      - maintaining-skills
    applies_when: template_maintenance_review
    not_applicable_reason: no_template_maintenance
  work-unit.release-and-rollback:
    primary_skill: maintaining-skills
    supporting_skills:
      - handoff
    skills:
      - maintaining-skills
      - handoff
    applies_when: template_checkpoint_required
    not_applicable_reason: no_checkpoint_required
readiness:
  all_of:
    - upstream_inputs_current_and_approved
    - tactical_design_current_or_not_applicable_recorded
    - api_freeze_or_no_api_impact_recorded
    - data_architecture_or_no_data_impact_recorded
    - ui_inputs_or_no_ui_impact_recorded
    - implementation_repositories_and_commands_registered
    - implementation_repository_preparation_completed
    - allowed_write_paths_registered
    - test_seams_and_acceptance_executable
    - task_packages_share_contract_version
    - no_blocking_signals
parallelism:
  test_seam_before_implementation: true
  frontend_backend_parallel_after_contract: false
  verifier_must_differ_from_worker: true
gates:
  architecture:
    - gate.backend-architecture-platform-approved
    - gate.technical-design-approved
    - gate.slice-contract-approved
  implementation:
    - gate.slice-ready-for-agent
  verification:
    - gate.fresh-verification-passed
  human:
    - gate.backend-architecture-platform-approved
    - gate.high-risk-architecture-confirmed
    - gate.openapi-freeze-confirmed
    - gate.merge-approved
re_route_on:
  - api-schema-impact
  - database-schema-impact
  - state-machine-impact
  - aggregate-impact
  - invariant-impact
  - scaffold-architecture-decision-changed
  - scaffold-profile-or-module-closure-changed
  - new-write-path
  - new-repository
  - contract-violation
  - test-seam-changed
  - verification-command-changed
scaffold_architecture_decision:
  applies_when: backend_scaffold_status_required
  owner: role.harness-orchestrator
  gate: gate.backend-architecture-platform-approved
  timing: after-impact-and-platform-candidate-resolution-before-ddd-or-mvc-branch-design
  evidence_file: scaffold-architecture-decisions.yaml
  schema_ref: docs/process/schemas/scaffold-architecture-decisions.schema.json
  recommendation:
    domain_driven_signals:
      - aggregate_invariants
      - complex_state_transitions
      - domain_events
      - consistency_boundary
      - rich_domain_behavior
    layered_mvc_signals:
      - thin_crud
      - reporting_query
      - simple_data_maintenance
      - no_aggregate_invariants
    output_required:
      - recommended_architecture
      - recommendation_reasons
  interaction:
    choices:
      - domain-driven
      - layered-mvc
    confirms_together:
      - architecture_family
      - exact_spring_boot_version
    user_confirmation_required: true
    silent_default: forbidden
    generator_interaction: forbidden
  project_inheritance:
    root_project_choice: child_default_only
    child_projects: visible_in_batch_confirmation
    child_override: allowed-with-reason
  lifecycle_status: lifecycle-approved
  change_policy:
    existing_or_initialized_project: no-regeneration
    architecture_switch: separate-migration-work-unit
    digest_change: stale-and-recompile
  existing_repository:
    gate_status: not-applicable
    architecture_source: current-existing-registration
    spring_boot_version_source: fixed-engineering-baseline-or-pom
    user_reconfirmation: forbidden-unless-source-changes
backend_scaffold:
  required_status: required
  generator_by_architecture:
    domain-driven: yss-ddd-scaffold-generator
    layered-mvc: yss-layered-mvc-scaffold-generator
  contract_schema:
    schema_version: 4
    schema_ref: docs/process/schemas/project-scaffold-contract.schema.json
    identity: project-engineering-baseline
    required:
      - contract_id
      - contract_version
      - kind
      - delivery_role
      - scaffold_kind
      - scaffold_request_id
      - status
      - compiler_draft_ref
      - lifecycle_approval_ref
      - persisted_ref
      - current_version
      - implementation_repository
      - backend_repository
      - scaffold_status
      - project_name
      - target_output_dir
      - repository_scope
      - init_git
      - base_package
      - architecture_family
      - generator_skill
      - decision_ref
      - decision_id
      - decision_digest
      - maven_coordinates
      - profiles
      - module_profile
      - allowed_write_paths
      - expected_evidence_files
      - verification_commands
      - approval
      - work_unit
      - generation_policy
      - design_prerequisites
    design_prerequisites:
      required:
        [
          technical_design,
          data_architecture_decision,
          api_contract_decision,
          engineering_contract_approval_ref
        ]
      artifact_binding: [ ref, version, digest ]
      approval_gate: gate.engineering-contract-approved
    status_by_owner:
      compiler:
        - draft
        - ready-for-lifecycle-review
        - blocked
      orchestrator:
        - approved
        - stale
        - blocked
    approval:
      required:
        - approval_ref
        - approver
        - persisted_ref
        - current_version
    generation_policy:
      required:
        - mode
        - existing_target
        - old_project_migration
        - template_upgrade
      mode: initialize-only
      existing_target: unsupported
      old_project_migration: unsupported
      template_upgrade: unsupported
    maven_coordinates:
      required:
        - group_id
        - project_version
        - parent
        - yss_components_version
      parent_required:
        - group_id
        - artifact_id
        - version
      yss_components_version: 2.0.0-SNAPSHOT
    profiles:
      required:
        - architecture
        - persistence
        - verification_database
        - production_database
        - platform
        - validation_namespace
        - dto_placement
        - repository
      supported_initial:
        domain-driven:
          architecture: target-domain-model
          persistence: mybatis-plus
          verification_database: h2
          production_database: not-bound
          platform: spring-boot-2.7-jdk8
          validation_namespace: javax
          dto_placement: web
          repository: yss-internal
        layered-mvc:
          architecture: layered-mvc
          persistence: mybatis-plus
          verification_database: h2
          production_database: not-bound
          platform: spring-boot-2.7-jdk8
          validation_namespace: javax
          dto_placement: web
          repository: yss-internal
      unsupported:
        - old-architecture-profile
        - client-in-domain
        - mybatis
        - spring-boot-3
        - jakarta
        - separate-client-module
    module_profile:
      resolution_version: 1
      domain-driven:
        - domain
        - application
        - infrastructure
        - adapter
        - bootstrap
      layered-mvc:
        core:
          - server
          - service
          - repository
        capability_modules:
          external-integration:
            - adapter
          published-client:
            - client
          feign-client:
            - client
            - feign-client
    unsupported_inputs:
      schema_v1: reject-no-auto-upgrade
      schema_v2_for_new_generation: reject-read-only-history
      schema_v3_for_new_generation: reject-historical-read-only
      slice_id: forbidden-as-scaffold-identity
      existing_project: reject-no-scaffold-migration
  required_inputs:
    - implementation_repository
    - backend_repository
    - scaffold_status
    - scaffold_target_confirmed
    - scaffold_request_id
    - target_output_dir
    - project_name
    - base_package
    - scaffold_architecture_decision_ref
    - scaffold_architecture_decision_id
    - scaffold_architecture_decision_digest
    - architecture_family
    - generator_skill
    - module_profile
    - maven_group_id
    - project_version
    - parent_group_id
    - parent_artifact_id
    - parent_version
    - yss_components_version
    - architecture_profile
    - persistence_profile
    - verification_database
    - production_database
    - platform_profile
    - validation_namespace
    - dto_placement
    - repository_profile
    - scaffold_contract_file
    - scaffold_contract_draft
    - scaffold_contract_id
    - scaffold_contract_version
    - scaffold_contract_status
    - scaffold_contract_approved
    - scaffold_contract_compiler_draft_ref
    - scaffold_contract_lifecycle_approval_ref
    - scaffold_contract_persisted
    - scaffold_contract_persisted_ref
    - scaffold_contract_current_version
    - technical_design_ref
    - technical_design_version
    - technical_design_digest
    - data_architecture_decision_ref
    - data_architecture_decision_version
    - data_architecture_decision_digest
    - api_contract_decision_ref
    - api_contract_decision_version
    - api_contract_decision_digest
    - engineering_contract_approval_ref
  required_evidence:
    - scaffold_architecture_decision
    - generator_inputs
    - expected_files
    - scaffold_generation_manifest_v4
    - generated_project_structure
    - generation_execution_result
    - verification_execution_result
    - architecture_rules
    - ./mvnw_validate
    - ./mvnw_test
    - ./mvnw_package
    - yss_skill_execution_result
  generation_options:
    with_example: false
    force: forbidden-by-default
    regeneration: unsupported
    template_upgrade: unsupported
    old_project_migration: unsupported-separate-architecture-modernization-initiative
  forbidden_generation:
    - business_rules
    - state_machine
    - permission
    - transaction
    - complex_query
    - error_mapping
    - user_visible_behavior
    - business_example_crud
    - unapproved_force_overwrite
  after_generation_by_architecture:
    domain-driven:
      - yss-implementation-contract-compiler
    layered-mvc:
      - yss-implementation-contract-compiler
  existing_or_initialized:
    - baseline_evidence
    - wrapper_verification
    - implementation_contract_recompile
  verification:
    commands:
      - ./mvnw validate
      - ./mvnw test
      - ./mvnw package
    requires_execution: true
    printed_commands_are_not_evidence: true
    completion_levels:
      - generated
      - empty-scaffold-verified
      - first-slice-verified
    downstream_readiness_claim_requires: first-slice-verified
    completion_requires:
      - validate_passed
      - test_passed
      - package_passed
    evidence:
      - preflight
      - command
      - exit_code
      - failure_category
      - duration_ms
      - stdout_ref
      - stderr_ref
      - executed_at
    failure_categories:
      - repository-access
      - project-model
      - compilation
      - bootstrap-entrypoint
      - test-failure
      - packaging
      - maven-execution
      - verification-preflight
    failure_action: blocked
consumer_entry_routes:
  yss-full-lifecycle:
    backend-technical-design:
      source_work_unit: work-unit.technical-design
      target_work_unit: work-unit.technical-analysis
  plan-to-backend:
    backend-technical-design:
      source_work_unit: work-unit.technical-design
      target_work_unit: work-unit.technical-analysis
  harness.backend-delivery:
    backend-technical-design:
      source_work_unit: work-unit.technical-design
      target_work_unit: work-unit.technical-design

stage_tracking:
  contract: docs/process/stage-tracking.md
  schema: docs/process/schemas/stage-tracking.schema.json
  verifier: scripts/stage-tracking
  configuration: tracker.lifecycle_tracking_version
  machine_state_owner: checkpoint.stage_tracking
  transition_checkpoint_ref: checkpoint_ref
  flush_on: [stage_exit, blocked, responsibility_changed, asset_approval]
  preserves: [ticket-state, gate-approval, profile-scope]
