routing:
- patterns: [".agents/skills/yss-technical-design/**", "scripts/lib/technical-design-boundary.mjs"]
  groups: [technical-design, implementation]
- patterns:
  - scripts/*backend-delivery*
  - scripts/*frontend-delivery*
  - scripts/*frontend-strategic-preflight*
  - scripts/lib/*backend-delivery*
  - scripts/lib/*frontend-delivery*
  - scripts/fixtures/backend-delivery/**
  - .template-spec/process/frontend-backend-delivery.md
  - .template-spec/process/schemas/backend-delivery*
  - .template-spec/process/schemas/frontend-delivery*
  - .template-spec/process/schemas/frontend-strategic-preflight*
  groups:
  - frontend-delivery
- patterns:
  - scripts/*strategic-handoff*
  - scripts/*strategic-feedback*
  - scripts/lib/strategic-handoff*
  - scripts/lib/strategic-feedback*
  - scripts/fixtures/strategic-handoff/**
  - .template-source/distribution/strategic-handoff-tools.lock.json
  - .template-spec/process/strategic-handoff-package.md
  - .template-spec/process/schemas/strategic-handoff-*
  - .template-spec/process/schemas/strategic-design-handoff-*
  - .template-spec/process/schemas/strategic-*feedback*
  groups:
  - strategic-handoff-package
- patterns:
  - AGENTS.md
  - CONTEXT.md
  - yss-project.yaml
  - package.json
  - .gitignore
  - README.md
  - docs/**
  groups:
  - hygiene
- patterns:
  - skills-lock.json
  - .agents/skills/**
  - .codex/skills/**
  - .cursor/skills/**
  - .pi/skills/**
  - .template-spec/agents/yss-skill-registry.yaml
  - scripts/*skill*
  groups:
  - skills
- patterns:
  - .agents/skills/yss-tactical-design/**
  groups:
  - tactical-design
- patterns:
  - .template-spec/process/maintenance-*
  - .template-spec/process/harness-process-tailoring.md
  - .template-spec/process/schemas/maintenance-*
  - scripts/*maintenance*
  - scripts/lib/maintenance-*
  groups:
  - maintenance
- patterns:
  - .template-spec/process/lifecycle-*
  - .template-spec/process/templates/lifecycle-*
  - scripts/*lifecycle*
  - scripts/lib/lifecycle-*
  groups:
  - lifecycle
- patterns:
  - .template-spec/agents/digital-human-*
  - .template-spec/process/schemas/*task-package*
  - .template-spec/templates/subagent-task-package-template.md
  - scripts/*task-package*
  - scripts/*digital-human*
  - scripts/lib/task-package*
  groups:
  - collaboration
  - workspace-fixtures
- patterns:
  - .template-spec/templates/openapi-*
  - .agents/skills/yss-openapi-*/**
  - .agents/skills/yss-dto/**
  - scripts/*openapi*
  - scripts/*dto*
  groups:
  - contracts
- patterns:
  - .template-spec/process/harness-profile.yaml
  - .template-spec/process/instance-distribution-manifest.yaml
  - scripts/*harness-profile*
  - scripts/*entry-alignment*
  - scripts/*instance-distribution*
  - scripts/lib/harness-profile.mjs
  - scripts/lib/entry-alignment.mjs
  - scripts/lib/instance-distribution.mjs
  groups:
  - profile
  - workspace-fixtures
- patterns:
  - .template-spec/process/implementation-*
  - scripts/*repository*
  - scripts/*implementation*
  - scripts/*scaffold*
  groups:
  - implementation
- patterns:
  - .template-source/**
  - scripts/vendor/**
  groups:
  - tooling
- patterns:
  - .github/**
  groups:
  - candidate-integrity
- patterns:
  - scripts/**
  groups:
  - hygiene
groups:
  technical-design:
    commands:
      - { run: "node .agents/skills/yss-technical-design/scripts/generate-schema.mjs --check" }
      - { run: "node .agents/skills/yss-technical-design/tests/run-scenarios.mjs" }
  frontend-delivery:
    commands:
    - run: scripts/verify-frontend-delivery-scenarios
  strategic-handoff-package:
    commands:
    - run: scripts/verify-strategic-handoff-tools-lock
      when: template-source
    - run: node --check scripts/lib/strategic-handoff.mjs
    - run: scripts/verify-strategic-handoff-package-scenarios
  hygiene:
    commands:
    - run: scripts/verify-governance-layout
  tooling:
    commands:
    - run: .template-source/scripts/evidence-index --check
      when: template-source
    - run: pnpm --dir .template-source/tooling/node test
      when: template-source
    - run: pnpm --dir .template-source/tooling/node check:vendor
      when: template-source
  skills:
    commands:
    - run: scripts/sync-skills --check
    - run: scripts/update-skill-lock --check
    - run: scripts/verify-skill-registry
    - run: scripts/verify-skill-governance
  tactical-design:
    commands:
    - run: node --check .agents/skills/yss-tactical-design/scripts/validate-tactical-design.mjs
    - run: node --check .agents/skills/yss-tactical-design/tests/run-scenarios.mjs
    - run: node .agents/skills/yss-tactical-design/tests/run-scenarios.mjs
  contracts:
    commands:
    - run: scripts/verify-yss-dto-openapi-profile
    - run: scripts/verify-yss-dto-openapi-scenarios
    - run: scripts/verify-openapi-yaml-first-scenarios
    - run: scripts/verify-openapi-json-handoff-scenarios
  collaboration:
    commands:
    - run: scripts/verify-digital-human-roles
    - run: scripts/verify-digital-human-roles-scenarios
    - run: scripts/verify-approval-record .template-spec/templates/approval-record-template.yaml
  lifecycle:
    commands:
    - run: scripts/verify-lifecycle-registry
    - run: scripts/verify-lifecycle-checkpoint .template-spec/process/templates/lifecycle-checkpoint-template.yaml
    - run: scripts/verify-frontend-implementation-evidence --allow-template .template-spec/process/templates/frontend-implementation-plan-template.yaml
    - run: scripts/verify-frontend-implementation-evidence --allow-template .template-spec/process/templates/frontend-implementation-verification-template.yaml
    - run: scripts/verify-frontend-implementation-evidence-scenarios
    - run: scripts/verify-scaffold-architecture-decisions --allow-template .template-spec/process/templates/scaffold-architecture-decisions-template.yaml
    - run: scripts/verify-scaffold-architecture-decision-scenarios
    - run: scripts/verify-lifecycle-scenarios
    - run: scripts/verify-lifecycle-transition-scenarios
  profile:
    commands:
    - run: scripts/verify-harness-profile
    - run: scripts/verify-harness-profile-scenarios
    - run: scripts/verify-entry-alignment
  workspace-fixtures:
    commands:
    - run: scripts/verify-subagent-task-package-scenarios
    - run: scripts/verify-digital-human-task-package-scenarios
    - run: scripts/verify-instance-distribution
    - run: scripts/verify-instance-distribution-scenarios
      when: template-source
  maintenance:
    commands:
    - run: scripts/verify-maintenance-checkpoint .template-source/evidence/maintenance/yss-tactical-design-l3-checkpoint-2026-08-27.yaml
      when: template-source
    - run: scripts/verify-maintenance-intensity-scenarios
  implementation:
    commands:
    - run: scripts/verify-implementation-path-scenarios
    - run: scripts/verify-repository-scope-scenarios
    - run: scripts/verify-scaffold-generator-scenarios
    - run: node --test .agents/skills/yss-ddd-scaffold-generator/scripts/scaffold-generator.test.mjs
    - run: node --test .agents/skills/yss-layered-mvc-scaffold-generator/scripts/scaffold-generator.test.mjs
    - run: node --test scripts/lib/legacy-backend-scaffold-audit.test.mjs
    - run: node --test scripts/lib/api-contract-decision.test.mjs
    - run: scripts/verify-prototype-backend-scaffold-scenarios
    - run: scripts/verify-matt-yss-integration-scenarios
      when: template-source
    - run: scripts/verify-yss-implementation-contract-compiler-scenarios
    - run: scripts/generate-yss-skill-boundaries --check
    - run: scripts/audit-yss-backend-skills --check
    - run: scripts/verify-retired-skill-ids
  governance-release:
    commands:
    - run: scripts/verify-governance-release
  candidate-integrity:
    commands:
    - run: scripts/verify-strategic-handoff-tools-lock --require-committed
      when: template-source
    - run: node scripts/verify-template-verification-scenarios
